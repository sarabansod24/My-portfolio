<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — Sara Bansod</title>
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FBF9F6;color:#2A2622;
       font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px;text-align:center}
  h1{font-size:clamp(28px,6vw,44px);margin:0 0 12px;letter-spacing:-.02em}
  p{margin:0 0 28px;color:#6B635B;font-size:16px;line-height:1.6}
  a{display:inline-block;padding:13px 24px;border-radius:999px;background:#B46A4D;color:#fff;
    text-decoration:none;font-weight:600;font-size:15px}
</style>
</head>
<body>
  <main>
    <h1>This page wandered off.</h1>
    <p>The link you followed doesn’t exist on this site.</p>
    <a id="home" href="/">Back to the portfolio</a>
  </main>
  <script>
    // Resolve the site root for both user pages and project pages.
    var parts = location.pathname.split('/').filter(Boolean);
    var root = (location.hostname.endsWith('github.io') && parts.length) ? '/' + parts[0] + '/' : '/';
    document.getElementById('home').setAttribute('href', root);
  </script>
</body>
</html>
